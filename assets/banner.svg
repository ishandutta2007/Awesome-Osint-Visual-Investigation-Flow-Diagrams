<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#b92b27"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Pulsing filter for nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseNode {
      0% { r: 6px; opacity: 0.7; }
      50% { r: 9px; opacity: 1; }
      100% { r: 6px; opacity: 0.7; }
    }
    @keyframes flowEdge {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes driftPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }
    .node-pulse { animation: pulseNode 3s infinite ease-in-out; }
    .flow-line { stroke-dasharray: 6 6; animation: flowEdge 2s linear infinite; }
    .radar { transform-origin: 1040px 180px; animation: radarSweep 10s linear infinite; }
    .floating-card { animation: driftPill 4s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle Investigation Grid Matrix -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.45">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Background Dynamic Network Graph (Visual Investigation Flow) in right half / lower layer -->
  <g opacity="0.55">
    <!-- Connecting Flow Diagram Edges -->
    <line x1="880" y1="80" x2="980" y2="140" stroke="#00f2fe" stroke-width="1.5" class="flow-line"/>
    <line x1="980" y1="140" x2="1110" y2="90" stroke="#38ef7d" stroke-width="1.5" class="flow-line"/>
    <line x1="980" y1="140" x2="1040" y2="240" stroke="#a855f7" stroke-width="1.5" class="flow-line"/>
    <line x1="1040" y1="240" x2="1140" y2="280" stroke="#00f2fe" stroke-width="1.5" class="flow-line"/>
    <line x1="880" y1="80" x2="820" y2="200" stroke="#4facfe" stroke-width="1.5" class="flow-line"/>
    <line x1="820" y1="200" x2="940" y2="290" stroke="#f43f5e" stroke-width="1.5" class="flow-line"/>
    <line x1="940" y1="290" x2="1040" y2="240" stroke="#38ef7d" stroke-width="1.5" class="flow-line"/>

    <!-- Graph Nodes -->
    <circle cx="880" cy="80" r="7" fill="#00f2fe" filter="url(#glow)" class="node-pulse"/>
    <circle cx="980" cy="140" r="10" fill="#a855f7" filter="url(#glow)" class="node-pulse"/>
    <circle cx="1110" cy="90" r="6" fill="#38ef7d" filter="url(#glow)"/>
    <circle cx="1040" cy="240" r="8" fill="#38ef7d" filter="url(#glow)" class="node-pulse"/>
    <circle cx="1140" cy="280" r="6" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="820" cy="200" r="7" fill="#f43f5e" filter="url(#glow)"/>
    <circle cx="940" cy="290" r="8" fill="#fbbf24" filter="url(#glow)"/>

    <!-- Radar Target Scanner in corner -->
    <circle cx="1040" cy="180" r="90" fill="none" stroke="#00f2fe" stroke-width="0.7" stroke-opacity="0.25"/>
    <circle cx="1040" cy="180" r="50" fill="none" stroke="#00f2fe" stroke-width="0.7" stroke-opacity="0.3"/>
    <line class="radar" x1="1040" y1="180" x2="1130" y2="180" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Foreground Title, Badges, and Descriptions (Positioned strictly in front, guaranteed clear visibility) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 52)" class="floating-card">
      <rect width="320" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="16" cy="15" r="4.5" fill="#22c55e"/>
      <text x="30" y="19" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED INVESTIGATION REPO • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Awesome OSINT Visual Investigation
    </text>

    <!-- Title Gradient Accent Underline -->
    <rect x="0" y="148" width="560" height="4" rx="2" fill="url(#accentLine)"/>

    <!-- Subtitle -->
    <text x="0" y="185" font-size="20" font-weight="600" fill="#38bdf8">
      Link Analysis Graphs, Threat Intel Flows &amp; Entity Resolution Canvases
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="218" font-size="14.5" font-weight="400" fill="#94a3b8">
      Interactive knowledge graphs, automated enrichment flows, attack surface diagrams,
    </text>
    <text x="0" y="240" font-size="14.5" font-weight="400" fill="#94a3b8">
      and forensic mapping frameworks for intelligence analysts, cyber defenders &amp; journalists.
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <g>
        <rect width="130" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="14" y="20" font-size="12" font-weight="600" fill="#e2e8f0">🔍 Link Analysis</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(142, 0)">
        <rect width="140" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="14" y="20" font-size="12" font-weight="600" fill="#e2e8f0">🛡️ Threat Intel Flow</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(294, 0)">
        <rect width="148" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="14" y="20" font-size="12" font-weight="600" fill="#e2e8f0">🌐 Attack Mapping</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(454, 0)">
        <rect width="138" height="32" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
        <text x="14" y="20" font-size="12" font-weight="600" fill="#e2e8f0">⚡ Open Source &amp; SaaS</text>
      </g>
    </g>
  </g>
</svg>
