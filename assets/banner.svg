<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="cyanPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#b92b27"/></linearGradient><linearGradient id="accentLine" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".2"/><stop offset="50%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#9d4edd" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseNode{0%{r:6px;opacity:.7}50%{r:9px;opacity:1}}@keyframes flowEdge{0%{stroke-dashoffset:60}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes driftPill{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}.node-pulse{animation:pulseNode 3s infinite ease-in-out}.flow-line{stroke-dasharray:6 6;animation:flowEdge 2s linear infinite}.radar{transform-origin:1040px 180px;animation:radarSweep 10s linear infinite}.floating-card{animation:driftPill 4s ease-in-out infinite}</style><rect width="100%" height="100%" fill="url(#bgGrad)"/><g stroke="#1e293b" stroke-width=".8" opacity=".45"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="3